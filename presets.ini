# LLM Router Mode Presets
# Each section defines a model that can be served via the router.
# Clients select the model by setting the "model" field in API requests.

[gemma4]
model = ~/llm-workspace/models/gemma-4-12B-it-Q4_K_M.gguf
n-gpu-layers = 99
ctx-size = 8192
jinja = true

[ornith]
model = ~/llm-workspace/models/ornith-1.0-9b-Q4_K_M.gguf
n-gpu-layers = 99
ctx-size = 8192
jinja = true
